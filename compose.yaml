
services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - database
      - mongodb
    environment:
      DATABASE_URL: mysql://app:app@database:3306/vite_et_gourmand?serverVersion=8.0
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: vite_gourmand_stats

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: vite_et_gourmand
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "3307:3306"

  mongodb:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"

volumes:
  database_data:
  mongo_data:
