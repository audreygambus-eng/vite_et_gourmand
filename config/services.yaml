
parameters:

services:
    
    _defaults:
        autowire: true      
        autoconfigure: true 
    
    App\:
        resource: '../src/'

    Cloudinary\Cloudinary:
        arguments:
            $config:
                cloud:
                    cloud_name: '%env(CLOUDINARY_CLOUD_NAME)%'
                    api_key: '%env(CLOUDINARY_API_KEY)%'
                    api_secret: '%env(CLOUDINARY_API_SECRET)%'

    ThomasVantuycom\FlysystemCloudinary\CloudinaryAdapter:
        arguments:
            $client: '@Cloudinary\Cloudinary'
